[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "domain-app"
version = "0.1.0"
description = "Task Management System - OOP Lab 4"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = [
    "mypy>=1.10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_ignores = true
warn_return_any = true
# Дозволяємо mypy знаходити наш пакет у папці src
mypy_path = "src"
explicit_package_bases = true